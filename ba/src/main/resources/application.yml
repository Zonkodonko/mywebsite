spring:
  application:
    name: zonkodonko
    dev: true

  datasource:
    url: jdbc:postgresql://localhost:5432/dev_db
    username:
    password:
    # driver-class-name optional, wird erkannt: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true


  security:
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: http://localhost:8080/realms/zonkodonko/protocol/openid-connect/token/introspect
          client-id: zonkodonko-rest-api
          client-secret:
    oidc:
      base-url: http://localhost:8080/realms/zonkodonko/protocol/openid-connect
      client-id: zonkodonko-rest-api
      client-secret:


server:
  port: 8081
