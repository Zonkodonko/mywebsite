<div class="blog-container">
  <div class="topic-carousal">
    @for(topic of topics; track topic) {
      <app-topic-card [topic]="topic" (openTopic)="openTopicDialog(topic.id)"></app-topic-card>
    }
    @if(isLoggedIn()) {
      <div id="add-topic-card" class="card topic-card container-primary position-relative" (click)="openTopicDialog()">
        <div id="add-topic-image" class="card-img-top">
          <i class="bi bi-plus-circle"></i>
        </div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <div class="fs-4">Click to add a new topic</div>
        </div>
      </div>
    }
  </div>
</div>
