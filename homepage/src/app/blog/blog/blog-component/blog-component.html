<div class="p-3 min-vh-100">
  <div class="topic-header d-flex flex-row">
    <img [src]="topic.image" class="topic-image">
    <div class="d-flex flex-column justify-content-center ms-3">
      <h1>{{topic.title}}</h1>
      <span [innerHTML]="topic.description"></span>
    </div>
  </div>

  @if (isLoggedIn) {
    <button class="btn w-100 border " (click)="openCreateDialog()">
      <i class="bi bi-plus-circle"></i>
    </button>
  }
  @for(article of articles; track article) {
    <app-article-card [article]="article"></app-article-card>

  }
</div>
