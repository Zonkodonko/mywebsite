<div class="min-vh-100">
<!--  TOPIC  -->
  <div class="topic-header d-flex flex-row border-bottom border-light-subtle">
    <img [src]="topic.image" class="topic-image">
    <div class="d-flex flex-column justify-content-center ms-3">
      <h1>{{topic.title}}</h1>
      <span [innerHTML]="topic.description"></span>
    </div>
  </div>

  <div class="d-flex flex-column align-items-center mt-2 p-3 gap-4">
<!--    ADD BUTTON -->
    @if (isLoggedIn) {
      <button class="btn w-100 border add-button " (click)="openArticleDialog()">
        <i class="bi bi-plus-circle"></i>
      </button>
    }
<!--    ARTICLE LIST -->
    @for(article of articlesRaw; track article) {
      <app-article-card [article]="article"
                        [canEdit]="isLoggedIn"
                        (editArticle)="openArticleDialog($event.id)"
                        (deleteArticle)="deleteArticle($event.id!)"
      ></app-article-card>
    }
  </div>
</div>
