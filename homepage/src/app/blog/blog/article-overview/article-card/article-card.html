<div class="p-2 article-card border-light shadow bg-primary ">
  @if (image != null) {
    <img [src]="image" class="article-image align-items-center" [alt]="title">
  }
  <div class="d-block overflow-hidden article-text">
    <h3 id="article-title">{{title}}</h3>
    <div class="article-description" [innerHTML]="content"></div>
  </div>
  <div class="corner-date bg-body">
    <span class="article-date text-light ">{{ article.created | date:'dd MMMM, yyyy':timezoneOffset:localeId }}</span>
  </div>
</div>
