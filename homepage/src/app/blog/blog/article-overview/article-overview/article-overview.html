<div class="min-vh-100">
  <!--  TOPIC  -->
  <div class="topic-header d-flex flex-row border-bottom secondary-container shadow">
    <img [src]="topic.image" class="topic-image">
    <div class="d-flex flex-column justify-content-center ms-3">
      <span class="fs-5 fw-bold">{{topic.title}}</span>
      <div class="topic-description" [innerHTML]="topic.description"></div>
    </div>
  </div>

  <div class="d-flex flex-column align-items-center mt-2 p-3 gap-4">
    <!--    ADD BUTTON -->
    @if (isLoggedIn) {
      <button class="btn w-100 border add-button btn-primary" (click)="openArticleDialog()">
        <i class="bi bi-plus-circle"></i>
      </button>
    }
    @for(article of articlesRaw; track article) {
      <app-article-card [article]="article"
                        [canEdit]="isLoggedIn"
                        (deleteArticle)="deleteArticle($event)"
                        (editArticle)="openArticleDialog($event)"
      ></app-article-card>
    }
  </div>
</div>
