<div class="min-vh-100 d-flex flex-column justify-content-center align-items-stretch">
  <!--  TOPIC  -->
  <div class="topic-header d-flex flex-row container-primary shadow">
    <img [src]="topic.image" class="topic-image">
    <div class="d-flex flex-column justify-content-center ms-3">
      <span class="fs-5 fw-bold">{{topic.title}}</span>
      <div class="topic-description" [innerHTML]="topic.description"></div>
    </div>
  </div>
  <a routerLink="/" class="back-button align-self-start clickable">
    <i class="bi bi-arrow-left me-1"></i>{{'global.back' | translate}}
  </a>
  <div class="pb-3 pw-3 article-container">
    <!--    ADD BUTTON -->
    @if (isLoggedIn) {
      <button class="btn border add-button btn-primary" (click)="openArticleDialog()">
        <i class="bi bi-plus-circle"></i>
      </button>
    }
    @for(article of articlesDisplay; track $index) {
      <app-article-card [article]="article"
                        [canEdit]="isLoggedIn"
                        (deleteArticle)="deleteArticle($event)"
                        (editArticle)="openArticleDialog($event)"
                        style="order:{{$index}}"
      ></app-article-card>
    }
  </div>
</div>
