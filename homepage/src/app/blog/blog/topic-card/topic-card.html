<div class="card topic-card container-primary shiny shadow-sm clickable"
     [routerLink]="['/blog', topic.id]"
     (mouseenter)="isHovered = true"
     (mouseleave)="isHovered = false">
  <img class="card-img-top" [src]="topic.image" [alt]="topic.title"/>
  <div class="card-body">
    <h5 class="card-title">{{topic.title}}</h5>
    <p class="card-text">{{topic.description}}</p>
  </div>
  <div class="card-corner-buttons" [hidden]="!isHovered">
    @if(isLoggedIn) {
      <button class="btn text-on-primary" (click)="open($event)">
        <i class="bi bi-pencil-square"></i>
      </button>
      <button class="btn text-on-primary" (click)="deleteTopic($event)">
        <i class="bi bi-trash"></i>
      </button>
    }
    <a class="btn text-on-primary" [routerLink]="['/blog', topic.id]">
      <i class="bi bi-box-arrow-up-right"></i>
    </a>
  </div>
</div>
