<div class="modal-header">{{"blog.article.dialog.title" | translate}}</div>
@if (titleImage != null) {
  <div class="d-flex flex-column align-items-center">
    <img [src]="titleImage.url" class="image-preview mt-3" alt="Preview">
    <div class="justify-content-center">{{titleImage?.name}}</div>
  </div>
}
<div class="d-flex flex-column p-3 modal-content">
  <form class="dialog-form">
    <!-- TITLE            -->
    <label for="titleInput" class="mt-3"> {{"global.title" | translate}} </label>
    <input id="titleInput"
           class="form-control mt-3 fs-3"
           type="text" [formControl]="titleControl" placeholder="Title">
    <!-- TITLE LANGUAGE   -->
    <div class="lang-switch btn-group btn-group-sm">
      <input id="titleLangDe" class="btn-check"
             type="radio"
             name="titleLang"
             [value]="'de'"
             [(ngModel)]="titleLang">
      <label for="titleLangDe" class="btn" [ngClass]="getTitleControl('de').invalid ? 'btn-outline-secondary' : 'btn-outline-success'">
        DE</label>
      <input id="titleLangEng" class="btn-check"
             type="radio"
             name="titleLang"
             [value]="'en'"
             [(ngModel)]="titleLang">
      <label for="titleLangEng" class="btn btn-outline-secondary" [ngClass]="getTitleControl('en').invalid ? 'btn-outline-secondary' : 'btn-outline-success'">
        ENG</label>
    </div>

    <!-- CONTENT      -->
    <label for="contentInput" class="mt-3 align-self-start"> {{"global.content" | translate}} </label>
    <textarea id="contentInput" class="form-control align-self-start mt-3" [formControl]="contentControl"
              [placeholder]="'global.content' | translate"></textarea>
    <!-- CONTENT LANGUAGE      -->
    <div class="lang-switch btn-group btn-group-sm">
      <input id="contentLangDe" class="btn-check"
             type="radio"
             name="contentLang"
             [value]="'de'"
             [(ngModel)]="contentLang">
      <label for="contentLangDe" class="btn" [ngClass]="getContentControl('de').invalid ? 'btn-outline-secondary' : 'btn-outline-success'">
        DE
      </label>
      <input id="contentLangEng" class="btn-check"
             type="radio"
             name="contentLang"
             [value]="'en'"
             [(ngModel)]="contentLang">
      <label for="contentLangEng" class="btn" [ngClass]="getContentControl('en').invalid ? 'btn-outline-secondary' : 'btn-outline-success'">
        ENG
      </label>
    </div>

    <span class="full-row mt-3">{{"blog.article.dialog.appearance.title" | translate}}</span>
    <ng-container [formGroup]="settingsControl">
      <label for="positionSelect" class="mt-3 align-self-center">
        {{"blog.article.dialog.appearance.position" | translate}}:
      </label>
      <select id="positionSelect" class="form-select align-self-start mt-3" formControlName="imagePosition">
        <option value="left">Left</option>
        <option value="right">Right</option>
        <option value="top">Top</option>
      </select>
    </ng-container>
    <label for="imageInput" class="mt-3 align-self-center border-0"> {{"global.image" | translate}} </label>
    <input #fileInput id="imageInput" class="form-control mt-3 border-0" type="file" (change)="onSelectFile($event)">

  </form>
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" (click)="cancel()">{{"global.cancel" | translate}}</button>
  <button class="btn btn-primary" [disabled]="form.invalid" (click)="save()">{{"global.save" | translate}}</button>
</div>
