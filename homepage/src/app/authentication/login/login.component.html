<form [formGroup]="loginForm" class="modal-body d-flex flex-column justify-content-center align-items-center gap-2">
  <p class="fs-2 fw-bold m-0">Login</p>
  <div class="d-flex flex-column gap-2 input-container">
    <div class="form-floating">
      <input id="username-input" type="text" formControlName="username" class="form-control" placeholder="Username" />
      <label for="username-input">Username</label>
    </div>
    <div class="form-floating">
      <input id="password-input" type="password" formControlName="password" class="form-control" placeholder="Password" />
      <label for="password-input">Password</label>
    </div>
  </div>
  <button (click)="login()" class="btn btn-primary">Login</button>
</form>
