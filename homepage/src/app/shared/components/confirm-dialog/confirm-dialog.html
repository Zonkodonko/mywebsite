<div class="modal-content p-3 d-flex flex-column align-items-center">
  <h2>Are you sure?</h2>
  <div class="d-flex flex-row justify-content-between w-100 gap-2">
    <button class="btn btn-primary flex-grow-1" (click)="confirm()">Yes</button>
    <button class="btn btn-secondary flex-grow-1" (click)="cancel()">No</button>
  </div>
</div>
