<div class="lang-switch" (click)="toggleLanguage()">
  <span class="fi" [ngClass]="{'fi-de': currentLanguage =='de', 'fi-gb': currentLanguage != 'de'}"></span>
</div>
<div id="login-container" (mouseenter)="showLoginButton()" (mouseleave)="hideLoginButton()">
  <button (click)="clickLoginLogoutButton()" [class.hidden]="!isShowLoginButton" class="bg-transparent border-0">
    <i class="bi text-white"
       [class.bi-key-fill]="!isLoggedIn"
       [class.bi-box-arrow-right]="isLoggedIn"
    ></i>
  </button>
</div>
<router-outlet></router-outlet>
